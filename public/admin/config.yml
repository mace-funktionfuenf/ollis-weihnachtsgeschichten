# Login is stubbed, not wired up yet: this config is correct and ready, but
# /admin can't actually authenticate until (1) a GitHub OAuth App is
# registered and (2) the small OAuth-broker service (base_url below) is
# deployed. See the migration plan for why Netlify's Git Gateway isn't used.
backend:
  name: github
  repo: mace-funktionfuenf/ollis-weihnachtsgeschichten
  branch: main
  base_url: https://REPLACE-WITH-OAUTH-BROKER-URL
  auth_endpoint: auth

# One person drafts, a different (or the same, case-by-case) person reviews
# and publishes — nothing goes live straight from a save.
publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"
locale: "de"
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: stories
    label: "Weihnachtsgeschichten"
    label_singular: "Weihnachtsgeschichte"
    folder: "src/content/stories"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "weihnachtsgeschichte-{{fields.year}}-{{fields.title}}"
    summary: "{{year}} — {{title}}"
    sortable_fields: [year, title, pubDate]
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - label: "Art"
        name: "kind"
        widget: "select"
        default: "jahresgeschichte"
        options:
          - { label: "Jahresgeschichte", value: "jahresgeschichte" }
          - { label: "Adventskalendergeschichte", value: "adventskalendergeschichte" }
      - { label: "Jahr", name: "year", widget: "number", value_type: "int", min: 2000, max: 2100 }
      - label: "Veröffentlicht am"
        name: "pubDate"
        widget: "datetime"
        date_format: "DD.MM.YYYY"
        time_format: false
      - { label: "Autor", name: "author", widget: "hidden", default: "olaf" }
      - label: "Teaser"
        name: "teaser"
        widget: "text"
        hint: "1–2 Sätze. Erscheint in Übersichten und bei Google."
      - { label: "Titelbild", name: "heroImage", widget: "image", required: false }
      - { label: "Bildbeschreibung", name: "heroImageAlt", widget: "string", required: false }
      - label: "Formate"
        name: "formats"
        widget: "select"
        multiple: true
        required: false
        options: [vorlesen, hoerbuch, hoerspiel, dvd, buch, plattdeutsch, lokal]
      - label: "Zielgruppe"
        name: "audience"
        widget: "select"
        multiple: true
        required: false
        options: [kinder, familie, erwachsene]
      - { label: "Entwurf", name: "draft", widget: "boolean", default: false }
      - { label: "Text", name: "body", widget: "markdown", modes: [rich_text, raw] }

  - name: posts
    label: "Weihnachtsblog"
    label_singular: "Blogbeitrag"
    folder: "src/content/posts"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Veröffentlicht am", name: "pubDate", widget: "datetime", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Autor", name: "author", widget: "hidden", default: "olaf" }
      - { label: "Teaser", name: "teaser", widget: "text" }
      - { label: "Titelbild", name: "heroImage", widget: "image", required: false }
      - { label: "Bildbeschreibung", name: "heroImageAlt", widget: "string", required: false }
      - { label: "Kategorien", name: "categories", widget: "list" }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: false }
      - { label: "Text", name: "body", widget: "markdown", modes: [rich_text, raw] }

  - name: products
    label: "Produkte (Affiliate)"
    label_singular: "Produkt"
    folder: "src/content/products"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Marke", name: "brand", widget: "string", required: false }
      - { label: "Bild", name: "image", widget: "image" }
      - { label: "Bildbeschreibung", name: "imageAlt", widget: "string" }
      - { label: "Kurzbeschreibung", name: "blurb", widget: "text" }
      - { label: "Link", name: "url", widget: "string" }
      - label: "Netzwerk"
        name: "network"
        widget: "select"
        default: "amazon"
        options: [amazon, awin, direkt]
      - { label: "ASIN", name: "asin", widget: "string", required: false }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options: [buch, hoerbuch, dvd, spielzeug, deko, kulinarik, sonstiges]
      - { label: "Aktiv", name: "active", widget: "boolean", default: true }

  - name: pages
    label: "Seiten"
    label_singular: "Seite"
    folder: "src/content/pages"
    create: false
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Text", name: "body", widget: "markdown", modes: [rich_text, raw] }
